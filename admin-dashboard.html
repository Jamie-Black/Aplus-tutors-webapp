<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | Aplus Tutors</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Dashboard CSS -->

    <link
        rel="stylesheet"
        href="admin-dashboard.css"
    >

</head>

<body data-role="admin">

    <!--==================================================
    PAGE LOADER
    ==================================================-->

    <div id="pageLoader">

        <div class="loader-content">

            <div class="loader-spinner"></div>

            <h3>Aplus Tutors</h3>

            <p>Loading Admin Dashboard...</p>

        </div>

    </div>

    <!--==================================================
    OVERLAY
    ==================================================-->

    <div
        id="overlay"
        class="overlay"
    ></div>

    <!--==================================================
    DASHBOARD LAYOUT
    ==================================================-->

    <div class="dashboard">

        <!-- Sidebar -->

        <aside id="sidebar"></aside>

        <!-- Main Content -->

        <main class="main-content">

            <!-- Topbar -->

            <header id="topbar"></header>

            <!-- Dashboard Content -->

            <section
                id="dashboardContent"
                class="page-content"
            >

                <!-- Greeting -->

                <div id="greetingCard"></div>

                <!-- Statistics -->

                <div id="statisticsCards"></div>

                <!-- Quick Actions -->

                <div id="quickActions"></div>

                <!-- Dashboard Charts -->

                <div id="dashboardCharts"></div>

                <!-- Recent Activities -->

                <div id="recentActivities"></div>

                <!-- Latest Students -->

                <div id="latestStudents"></div>

            </section>

        </main>

    </div>

    <!--==================================================
    MODALS
    ==================================================-->

    <div id="modalContainer"></div>

    <!--==================================================
    JAVASCRIPT
    ==================================================-->
    
    <script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Appwrite -->

    <script src="appwrite.js"></script>

    <!-- Authentication Guard -->
    
    <script src="guard.js"></script>

    <!-- Admin Dashboard -->

<script src="admin-dashboard.js"></script>

<script src="admin-dashboard-data.js"></script>

</body>

</html>
