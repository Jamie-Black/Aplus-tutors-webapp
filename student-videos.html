<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Watch Aplus Tutors video lessons and improve your exam preparation."
    >

    <meta
        name="theme-color"
        content="#b00020"
    >

    <title>Video Lessons | Aplus Tutors</title>


    <!-- ==================================================
         GOOGLE FONT
    =================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- ==================================================
         FONT AWESOME
    =================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- ==================================================
         BOOTSTRAP
    =================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ==================================================
         STUDENT DASHBOARD CSS
    =================================================== -->

    <link
        rel="stylesheet"
        href="student-dashboard.css"
    >


    <!-- ==================================================
         STUDENT VIDEOS CSS
    =================================================== -->

    <link
        rel="stylesheet"
        href="student-videos.css"
    >

</head>


<body data-role="student">


    <!-- ==================================================
         PAGE LOADER
    =================================================== -->

    <div
        id="pageLoader"
        class="page-loader"
    >

        <div class="loader-wrapper">

            <div class="loader"></div>

            <div class="loader-brand">
                Aplus Tutors
            </div>

            <p>
                Loading your videos...
            </p>

        </div>

    </div>


    <!-- ==================================================
         MOBILE SIDEBAR OVERLAY
    =================================================== -->

    <div
        id="overlay"
        class="overlay"
    ></div>


    <!-- ==================================================
         DASHBOARD APP
    =================================================== -->

    <div class="dashboard-app">


        <!-- ==================================================
             SIDEBAR
        =================================================== -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <!-- Generated by student-dashboard.js -->

        </aside>


        <!-- ==================================================
             MAIN AREA
        =================================================== -->

        <div class="dashboard-main">


            <!-- ==================================================
                 TOPBAR
            =================================================== -->

            <header
                id="topbar"
                class="topbar"
            >

                <!-- Generated by student-dashboard.js -->

            </header>


            <!-- ==================================================
                 PAGE CONTENT
            =================================================== -->

            <main class="dashboard-content">


                <!-- ==================================================
                     PAGE HEADER
                =================================================== -->

                <section class="videos-page-header">

                    <div class="videos-page-heading">

                        <span class="videos-page-icon">
                            <i class="fa-solid fa-circle-play"></i>
                        </span>

                        <div>

                            <h1>
                                Video Lessons
                            </h1>

                            <p>
                                Learn from guided lessons and strengthen
                                your exam preparation.
                            </p>

                        </div>

                    </div>


                    <!-- ==================================================
                         SUBJECT FILTER
                    =================================================== -->

                    <div class="videos-filter-wrapper">

                        <label
                            for="videoSubjectFilter"
                            class="visually-hidden"
                        >
                            Filter by subject
                        </label>

                        <select
                            id="videoSubjectFilter"
                            class="videos-subject-filter"
                        >

                            <option value="">
                                All subjects
                            </option>

                        </select>

                    </div>

                </section>


                <!-- ==================================================
                     VIDEO PAGE MESSAGE
                =================================================== -->

                <div
                    id="videoPageMessage"
                    class="video-page-message"
                    hidden
                ></div>


                <!-- ==================================================
                     VIDEO COUNT
                =================================================== -->

                <div
                    id="videoLessonCount"
                    class="video-lesson-count"
                >
                    Loading lessons...
                </div>


                <!-- ==================================================
                     VIDEO LESSONS
                =================================================== -->

                <section
                    id="studentVideoLessons"
                    class="student-video-lessons"
                    aria-label="Video lessons"
                >

                    <div class="student-video-loading">

                        <div class="video-loading-spinner"></div>

                        <p>
                            Loading video lessons...
                        </p>

                    </div>

                </section>


            </main>


            <!-- ==================================================
                 FOOTER
            =================================================== -->

            <footer
                id="dashboardFooter"
                class="dashboard-footer"
            >

                <div class="footer-brand">

                    <strong>
                        Aplus Tutors
                    </strong>

                    <span>
                        Your smarter path to exam success.
                    </span>

                </div>


                <div class="footer-meta">

                    <span>
                        © 2026 Aplus Tutors
                    </span>

                    <span class="footer-divider">
                        •
                    </span>

                    <span>
                        Student Portal v2.0
                    </span>

                </div>

            </footer>


        </div>

    </div>


    <!-- ==================================================
         APPWRITE SDK
    =================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"
    ></script>


    <!-- ==================================================
         BOOTSTRAP JS
    =================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- ==================================================
         APPWRITE CONFIGURATION
    =================================================== -->

    <script
        src="appwrite.js"
    ></script>


    <!-- ==================================================
         AUTHENTICATION GUARD
    =================================================== -->

    <script
        src="guard.js"
    ></script>


    <!-- ==================================================
         STUDENT DASHBOARD SCRIPT
    =================================================== -->

    <script
        src="student-dashboard.js"
    ></script>
    
    
    
    <script
        src="student-notifications-core.js"
    ></script>


    <!-- ==================================================
         STUDENT VIDEOS SCRIPT
    =================================================== -->

    <script
        src="student-videos.js"
    ></script>


</body>

</html>
